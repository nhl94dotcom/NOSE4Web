# Builds the site and publishes it to GitHub Pages on every push to main.
# In the repository's settings, Pages must have "GitHub Actions" as its source.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that has started is let finish: a newer push waits its turn
# rather than cancelling it, since a publish cancelled part way can leave the
# next one failing (as two pushes a few minutes apart did on 2026-11-09).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tests that need a ROM skip themselves here, since none is in the repository.
      - run: npm test
      # The runner already has the libraries Chromium needs; installing them
      # again goes through Ubuntu's mirrors, which are sometimes unreachable
      # from GitHub's machines. Then the browser alone is enough.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
